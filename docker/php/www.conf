; =====================================================================
; Patron Hub - PHP-FPM プロセス設定
;
; ログイン失敗時・ブロック時に応答を遅らせる仕様(config/auth.php の
; login_throttle)があるため、1リクエストが最大120秒プロセスを占有する。
;
; PHP-FPM の既定は pm.max_children = 5 で、これは「同時に5リクエストまで
; しか処理できない」という意味。遅延中のリクエストが5件たまると、
; 通常の利用者まで一切応答を受け取れなくなる(自分自身への DoS)。
;
; そのため同時プロセス数を増やしている。sleep 中のプロセスは CPU を
; 使わずメモリだけを保持するため、数を増やしても負荷はほぼ増えない。
;
; 目安: 同時に遅延させたい数 + 通常利用者の同時アクセス数
; =====================================================================

[www]

pm = dynamic

; 同時に処理できるリクエスト数の上限
pm.max_children = 40

; 起動時に用意しておくプロセス数
pm.start_servers = 4

; 待機プロセスの下限・上限(アクセス増減に応じて自動で増減する)
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; 一定回数処理したらプロセスを作り直す(メモリリーク対策)
pm.max_requests = 500

; リクエストがこの時間を超えたら強制終了する。
; 遅延の最大値(120秒)より長くしておくこと。0 は無制限。
request_terminate_timeout = 180s

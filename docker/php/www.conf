; =====================================================================
; Patron Hub - PHP-FPM プロセス設定
;
; ログイン失敗時・ブロック時に応答を遅らせる仕様(config/auth.php の
; login_throttle)があるため、1リクエストが最大120秒プロセスを占有する。
;
; PHP-FPM の既定は pm.max_children = 5 で、これは「同時に5リクエストまで
; しか処理できない」という意味。遅延中のリクエストが5件たまると、
; 通常の利用者まで一切応答を受け取れなくなる(自分自身への DoS)。
;
; そのため同時プロセス数を増やしている。sleep 中のプロセスは CPU を
; 使わずメモリだけを保持するため、数を増やしても負荷はほぼ増えない。
;
; 目安: 同時に遅延させたい数 + 通常利用者の同時アクセス数
; =====================================================================

[www]

; ワーカーの実行ユーザー。既定の www-data(uid 33) ではなく、ホスト側の
; ファイル所有者と同じ uid 1000 で動かす。
;
; 理由: compose.yaml は customer-management_app/ をバインドマウントしている。
; バインドマウントはホスト側の所有者・権限をそのままコンテナに持ち込むため、
; Dockerfile の `chown -R www-data storage` は実行時に上書きされて無効になる。
; その結果 www-data では次の2つができない。
;   ・.env の読み取り (640 かつ所有者 uid 1000 のため → 設定が全て既定値に
;     なり APP_KEY 不在で 500 になる)
;   ・storage/ bootstrap/cache への書き込み (Blade のコンパイル等)
;
; .env を 644 にして回避してはいけない。このサーバは他プロジェクトと同居して
; おり、DB パスワード・APP_KEY・SEARCH_HASH_KEY が他ユーザーから読めてしまう。
;
; PHP-FPM は user/group に数値 uid/gid を指定できる(コンテナ内に uid 1000 の
; ユーザーが存在しなくてよい)。
user = 1000
group = 1000

pm = dynamic

; 同時に処理できるリクエスト数の上限
pm.max_children = 40

; 起動時に用意しておくプロセス数
pm.start_servers = 4

; 待機プロセスの下限・上限(アクセス増減に応じて自動で増減する)
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; 一定回数処理したらプロセスを作り直す(メモリリーク対策)
pm.max_requests = 500

; リクエストがこの時間を超えたら強制終了する。
; 遅延の最大値(120秒)より長くしておくこと。0 は無制限。
request_terminate_timeout = 180s

; ワーカーの標準出力・標準エラーを FPM のログへ転送する。
; 既定(no)ではワーカーの出力が破棄され、致命的エラーの内容が
; `docker compose logs app` に一切出ないため調査ができない。
catch_workers_output = yes

; 転送時に行頭へ付く装飾([pool www] 等)を外し、そのままの行を出す。
decorate_workers_output = no

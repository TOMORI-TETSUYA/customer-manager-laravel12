; Patron Hub - PHP settings
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
; ログイン失敗時・ブロック時に応答を遅らせる仕様があるため、
; その秒数(config/auth.php の login_throttle)より長くしておく。
; 既定の 60 のままだと、120秒待つ前に PHP が中断されてしまう。
max_execution_time = 180
date.timezone = Asia/Tokyo
expose_php = Off

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Session hardening (Laravel manages sessions, defense in depth)
session.cookie_httponly = 1
session.use_strict_mode = 1

server {
    listen 80;
    server_name _;

    root /var/www/customer-management;
    index php/index.php;

    charset utf-8;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy
        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()" always;

    # 検索エンジンへの登録を拒否する。
    #
    # robots.txt は「巡回しないでほしい」というお願いに過ぎず、
    # 無視するクローラーもいる。このヘッダーは実際にアクセスされた
    # ときに「登録するな」と伝えるもので、HTMLだけでなく画像や
    # PDFなど meta タグを書けないファイルにも効く。
    #
    #   noindex       : 検索結果に出さない
    #   nofollow      : ページ内のリンクをたどらない
    #   noarchive     : キャッシュ(保存版)を見せない
    #   nosnippet     : 検索結果に本文の抜粋を出さない
    #   noimageindex  : 画像を検索対象にしない
    #   notranslate   : 翻訳版を提供しない
    add_header X-Robots-Tag
        "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" always;

    location / {
        try_files $uri $uri/ /php/index.php?$query_string;
    }

    # ファビコンは images/ 配下に置いている。
    # ブラウザやツールがHTMLのlink指定を無視して /favicon.ico を
    # 直接取りに来ることがあるため、そちらへ振り向ける。
    location = /favicon.ico {
        try_files /images/favicon.ico =404;
        access_log off;
        expires 7d;
    }

    location = /php/index.php {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # ログイン失敗時・ブロック時に応答を遅らせる仕様があるため、
        # その秒数(config/auth.php の login_throttle)より長くしておく。
        # 既定の60秒のままだと、120秒待つ前に 504 を返してしまう。
        fastcgi_read_timeout 180s;

        fastcgi_param SCRIPT_FILENAME
            $document_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";

        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
        expires 7d;
        access_log off;

        # 【重要】nginx の add_header は「そのブロックに1つでも add_header が
        # あると、上位ブロックの add_header をすべて引き継がない」という仕様。
        # このブロックで Cache-Control を足すと、server 側で指定した
        # X-Robots-Tag などが消えてしまうため、ここで全て書き直している。
        # server ブロック側を変更したら、こちらも合わせて更新すること。
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy
            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag
            "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" always;
    }
}

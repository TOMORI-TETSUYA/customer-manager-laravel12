name: customer_manager

services:
  nginx:
    image: nginx:stable-alpine
    container_name: customer_manager_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./customer-management:/var/www/customer-management:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - customer_manager_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: customer_manager_app
    restart: unless-stopped
    working_dir: /var/www/customer-management_app
    env_file:
      - .env
    volumes:
      - ./customer-management_app:/var/www/customer-management_app
      - ./customer-management:/var/www/customer-management
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-customer-manager.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - customer_manager_network

  db:
    image: mysql:8.4
    container_name: customer_manager_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/customer-manager.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - customer_manager_network

networks:
  customer_manager_network:
    driver: bridge

volumes:
  db_data:
